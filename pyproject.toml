[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-visibility-checker"
version = "0.1.0"
description = "Free GEO visibility checker — track brand mentions in AI answers (Gemini free tier) and audit pages for citation-readiness"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
app = ["streamlit>=1.41", "google-generativeai>=0.8"]

[project.scripts]
geo_check = "geo_check.cli:main"
